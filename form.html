<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Question - Quiz App</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="./js/form.js" defer></script>
  </head>

  <body>
    <header class="header">
      <h1 class="header__title">HTML and CSS Quiz</h1>
    </header>

    <main class="quiz" data-js="quiz-form-container">
      <form class="quiz-form" data-js="quiz-form">
        <label for="question">Your question:</label>
        <textarea
          id="question"
          data-js="question"
          name="question"
          maxlength="150"
        ></textarea>
        <p id="question-counter" data-js="question-counter">
          150 characters remaining
        </p>
        <label for="answer">Your Answer:</label>
        <textarea
          id="answer"
          data-js="answer"
          name="answer"
          maxlength="150"
        ></textarea>
        <p id="answer-counter" data-js="answer-counter">
          150 characters remaining
        </p>
        <label for="tag">Tags:</label>
        <input type="text" id="tag" data-js="tag" name="tag" />
        <button class="button" type="submit">Add Question</button>
      </form>
    </main>

    <nav class="navigation">
      <a class="nav__link" href="index.html">⌂ Home</a>
      <a class="nav__link" href="bookmarks.html">♡ Bookmarks</a>
      <a class="nav__link active" href="form.html">＋ Add</a>
      <a class="nav__link" href="profile.html">♙ Profile</a>
    </nav>
  </body>
</html>
